<!DOCTYPE html>
<html>
<head>
    <title>Login - Signing Portal</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 50px;
            width: 380px;
            border-radius: 12px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: #1976d2;
            outline: none;
            box-shadow: 0 0 0 2px rgba(25,118,210,0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #1976d2;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca1;
        }

        .remember {
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>🔐 Signing Portal</h2>
    <div class="subtitle">
        Secure Document Authorization System
    </div>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="text"
               name="uid"
               placeholder="Employee UID"
               required>

        <div class="remember">
            <input type="checkbox" name="remember">
            Remember Me
        </div>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
